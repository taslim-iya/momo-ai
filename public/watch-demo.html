<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Demo — Momo AI</title>
    <meta name="description" content="Watch Momo Autopilot turn a Companies House number into a bound quote in seconds." />
    <style>
      :root {
        --navy-deep: #0a1628;
        --navy-soft: #14213d;
        --paper: #f8f6f1;
        --paper-65: rgba(248, 246, 241, 0.65);
        --paper-55: rgba(248, 246, 241, 0.55);
        --paper-10: rgba(248, 246, 241, 0.10);
        --accent: #d97706;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--navy-deep);
        color: var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--paper); }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
      }
      header.top {
        padding: 20px 0;
        border-bottom: 1px solid var(--paper-10);
      }
      header.top .container { display: flex; align-items: center; justify-content: space-between; }
      .brand { font-weight: 600; letter-spacing: -0.01em; font-size: 18px; }
      .brand span { color: var(--accent); }
      .back { font-size: 14px; color: var(--paper-65); text-decoration: none; }
      .back:hover { color: var(--paper); }
      .hero { position: relative; overflow: hidden; padding: 64px 0 32px; }
      .hero::before {
        content: "";
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at top, rgba(217, 119, 6, 0.12), transparent 60%);
        pointer-events: none;
      }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em;
        color: var(--paper-65);
        padding: 6px 12px;
        border: 1px solid var(--paper-10);
        border-radius: 999px;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(36px, 5vw, 56px);
        line-height: 1.05;
        margin: 20px 0 16px;
        max-width: 820px;
        letter-spacing: -0.01em;
      }
      .lead { color: var(--paper-65); max-width: 640px; font-size: 17px; line-height: 1.55; }
      .video-wrap {
        margin: 8px 0 64px;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid var(--paper-10);
        background: #000;
        box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
      }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
      .caption {
        text-align: center;
        font-size: 12px;
        color: var(--paper-55);
        margin: -48px 0 48px;
        display: flex; justify-content: center; align-items: center; gap: 8px;
      }
      .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="container">
        <a class="brand" href="/">momo<span>.</span>ai</a>
        <a class="back" href="/">← Back to site</a>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <span class="eyebrow">✦ Watch Momo Autopilot</span>
        <h1>From a Companies House number to a bound quote — in seconds.</h1>
        <p class="lead">Watch the recording below to see Momo Autopilot in action.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="video-wrap">
          <video src="/momo-demo.mp4" controls autoplay muted playsinline preload="metadata">
            Your browser can't play this video.
          </video>
        </div>
        <div class="caption"><span class="dot"></span> Recorded walkthrough</div>
      </div>
    </section>
  </body>
</html>
